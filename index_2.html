<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F2F2F7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
<title>Mes vidéos</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,400..600,0..1,0&display=block" rel="stylesheet">
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root{
  --bg:#F2F2F7; --card:#FFFFFF; --card2:#F2F2F7; --fill:rgba(118,118,128,.12); --fill2:rgba(118,118,128,.2);
  --text:#1C1C1E; --text2:#6C6C70; --text3:#AEAEB2; --sep:rgba(60,60,67,.14);
  --accent:#0A66D6; --accent-soft:rgba(10,102,214,.12); --red:#E5352B; --orange:#E8820C; --green:#248A3D;
  --bar:rgba(249,249,251,.86); --shadow:0 1px 2px rgba(0,0,0,.04),0 4px 14px rgba(0,0,0,.05);
  --sheet:#FFFFFF; --backdrop:rgba(0,0,0,.28);
}
:root[data-theme="dark"]{
  --bg:#000000; --card:#1C1C1E; --card2:#2C2C2E; --fill:rgba(118,118,128,.24); --fill2:rgba(118,118,128,.32);
  --text:#FFFFFF; --text2:#98989F; --text3:#5A5A5F; --sep:rgba(84,84,88,.5);
  --accent:#0A84FF; --accent-soft:rgba(10,132,255,.18); --red:#FF453A; --orange:#FF9F0A; --green:#30D158;
  --bar:rgba(22,22,24,.86); --shadow:none; --sheet:#1C1C1E; --backdrop:rgba(0,0,0,.55);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{background:var(--bg);color:var(--text)}
body{font-family:-apple-system,"SF Pro Text","SF Pro Display",Inter,system-ui,sans-serif;font-size:17px;line-height:1.3;
  -webkit-font-smoothing:antialiased;overscroll-behavior-y:none;min-height:100vh}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
input,textarea,select{font:inherit;color:inherit}
.ms{font-family:"Material Symbols Rounded";font-weight:500;font-style:normal;font-size:22px;line-height:1;letter-spacing:normal;
  text-transform:none;display:inline-block;white-space:nowrap;direction:ltr;-webkit-font-feature-settings:"liga";font-feature-settings:"liga";
  font-variation-settings:"FILL" 0,"wght" 500,"opsz" 24;user-select:none}
.ms.f{font-variation-settings:"FILL" 1,"wght" 500,"opsz" 24}
.hidden{display:none!important}
.clamp1{display:-webkit-box;-webkit-line-clamp:1;-webkit-box-orient:vertical;overflow:hidden}
.clamp2{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}

/* ---------- structure ---------- */
#app{max-width:560px;margin:0 auto;padding-bottom:calc(96px + env(safe-area-inset-bottom))}
.screen{padding:0 16px;animation:fade .22s ease}
@keyframes fade{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
.nav{display:flex;align-items:center;justify-content:space-between;height:44px;margin-top:6px}
.nav .back{display:flex;align-items:center;gap:2px;color:var(--accent);font-size:17px;margin-left:-6px}
.nav .back .ms{font-size:28px}
.nav .act{color:var(--accent);font-size:17px;font-weight:500;display:flex;align-items:center;gap:4px}
.icon-btn{width:36px;height:36px;border-radius:18px;display:flex;align-items:center;justify-content:center;background:var(--fill);color:var(--accent)}
.lt{font-size:34px;font-weight:800;letter-spacing:-.9px;line-height:1.12;margin:2px 0 2px}
.sub{color:var(--text2);font-size:15px;margin-bottom:14px;display:flex;align-items:center;gap:5px}
.sub .ms{font-size:17px}
.sec{display:flex;justify-content:space-between;align-items:baseline;margin:26px 2px 10px}
.sec h2{font-size:22px;font-weight:800;letter-spacing:-.5px}
.sec button{color:var(--accent);font-size:16px}
.cap{font-size:13px;color:var(--text2);text-transform:uppercase;letter-spacing:.2px;margin:24px 16px 7px;display:flex;justify-content:space-between}
.search{display:flex;align-items:center;gap:7px;background:var(--fill);border-radius:12px;height:38px;padding:0 10px;color:var(--text2);margin:8px 0 4px}
.search input{flex:1;background:none;border:0;outline:0;font-size:17px;color:var(--text);min-width:0}
.search input::placeholder{color:var(--text2)}
.search .ms{font-size:21px}

/* ---------- vignettes ---------- */
.thumb{position:relative;overflow:hidden;border-radius:12px;flex:none;display:flex;align-items:center;justify-content:center;color:#fff}
.thumb img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.thumb .ph{font-size:30px;opacity:.95}
.dur{position:absolute;right:6px;bottom:6px;background:rgba(0,0,0,.55);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);
  color:#fff;font-size:11.5px;font-weight:700;border-radius:7px;padding:2px 6px;font-variant-numeric:tabular-nums}
.seenmark{position:absolute;inset:0;background:rgba(0,0,0,.35);display:flex;align-items:center;justify-content:center}
.seenmark .ms{font-size:30px;color:#fff}

/* ---------- Ma liste (accueil) ---------- */
.shelf{display:flex;gap:12px;overflow-x:auto;margin:0 -16px;padding:0 16px 4px;scroll-snap-type:x mandatory;scroll-padding:0 16px;scrollbar-width:none}
.shelf::-webkit-scrollbar{display:none}
.mcard{width:156px;flex:none;scroll-snap-align:start;text-align:left}
.mcard .thumb{width:156px;height:156px;border-radius:16px}
.rank{position:absolute;top:8px;left:8px;width:26px;height:26px;border-radius:13px;background:rgba(255,255,255,.94);color:#1c1c1e;
  font-size:14px;font-weight:800;display:flex;align-items:center;justify-content:center;z-index:1}
.mcard p{font-size:15px;font-weight:600;margin-top:8px;line-height:1.25}
.mcard small{font-size:13px;color:var(--text2)}
.hint{background:var(--card);border-radius:14px;padding:14px 16px;color:var(--text2);font-size:15px;display:flex;gap:10px;align-items:center;box-shadow:var(--shadow)}
.hint .ms{color:var(--accent)}

/* ---------- tuiles catégories ---------- */
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.tile{position:relative;height:118px;border-radius:20px;padding:13px 14px;color:#fff;text-align:left;display:flex;flex-direction:column;justify-content:space-between;overflow:hidden;transition:transform .15s}
.tile:active{transform:scale(.97)}
.tile .ic{width:38px;height:38px;border-radius:19px;background:rgba(255,255,255,.22);display:flex;align-items:center;justify-content:center}
.tile .ic .ms{font-size:22px}
.tile b{font-size:18px;font-weight:700;letter-spacing:-.3px;display:block;line-height:1.15}
.tile small{font-size:13px;opacity:.88}
.tile .badge{position:absolute;top:13px;right:13px;min-width:22px;height:22px;border-radius:11px;background:#fff;color:#1c1c1e;font-size:12.5px;font-weight:800;padding:0 7px;display:flex;align-items:center;justify-content:center}

/* ---------- listes groupées ---------- */
.group{background:var(--card);border-radius:14px;overflow:hidden;box-shadow:var(--shadow)}
.row{display:flex;align-items:center;gap:12px;padding:10px 12px;width:100%;text-align:left;position:relative}
.row+.row::before{content:"";position:absolute;top:0;right:0;left:var(--inset,86px);height:1px;background:var(--sep);transform:scaleY(.6)}
.row .tx{flex:1;min-width:0}
.row .t{font-size:16.5px;font-weight:600;letter-spacing:-.2px;line-height:1.25}
.row .m{font-size:13.5px;color:var(--text2);margin-top:2px}
.row .chev{color:var(--text3);font-size:22px}
.row.seen .t{color:var(--text2)}
.row.seen .thumb{opacity:.55}
.pills{display:flex;gap:6px;align-items:center;margin-top:5px;min-width:0}
.pill{font-size:12px;font-weight:700;border-radius:6px;padding:2px 7px;flex:none}
.p-urgent{background:rgba(229,53,43,.13);color:var(--red)}
.p-bientot{background:rgba(232,130,12,.15);color:var(--orange)}
.p-plus_tard{background:var(--fill);color:var(--text2)}
.p-vu{background:rgba(36,138,61,.13);color:var(--green)}
.verd{font-size:12.5px;color:var(--text2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.crow{--inset:58px}
.crow .ci{width:32px;height:32px;border-radius:9px;display:flex;align-items:center;justify-content:center;color:#fff;flex:none}
.crow .ci .ms{font-size:19px}
.crow .t{font-weight:500}
.crow .n{color:var(--text2);font-size:16px}
.linkrow{color:var(--accent);font-weight:500;--inset:58px}
.linkrow .ci{background:var(--accent-soft);color:var(--accent)}
.foot{font-size:13px;color:var(--text2);text-align:center;margin:14px 20px;line-height:1.4}

/* ---------- contrôles ---------- */
.seg{display:flex;background:var(--fill);border-radius:9px;padding:2px;gap:2px}
.seg button{flex:1;font-size:13.5px;font-weight:600;padding:6px 10px;border-radius:7px;color:var(--text);white-space:nowrap}
.seg button.on{background:var(--card);box-shadow:0 1px 4px rgba(0,0,0,.14)}
:root[data-theme="dark"] .seg button.on{background:#636366}
.toolbar{display:flex;justify-content:space-between;align-items:center;margin:4px 0 12px;gap:12px}
.toolbar .seg{flex:0 0 190px}
.sortsel{position:relative;color:var(--accent);font-size:15px;font-weight:600;display:flex;align-items:center}
.sortsel select{position:absolute;inset:0;opacity:0}
.btn{display:flex;align-items:center;justify-content:center;gap:6px;width:100%;height:50px;border-radius:14px;background:var(--accent);color:#fff;font-size:17px;font-weight:700}
.btn2{display:flex;align-items:center;justify-content:center;gap:5px;height:44px;border-radius:12px;background:var(--fill);color:var(--accent);font-size:14.5px;font-weight:600}
.btn2.on{background:var(--accent);color:#fff}
.btn2 .ms{font-size:19px}
.danger{color:var(--red)!important}

/* ---------- barre d'onglets ---------- */
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--bar);backdrop-filter:saturate(180%) blur(20px);-webkit-backdrop-filter:saturate(180%) blur(20px);
  border-top:.5px solid var(--sep);display:flex;justify-content:center;padding:7px 0 calc(8px + env(safe-area-inset-bottom))}
.tabbar .in{display:flex;justify-content:space-around;width:100%;max-width:560px}
.tab{display:flex;flex-direction:column;align-items:center;gap:2px;font-size:10.5px;font-weight:600;color:var(--text2);width:90px;position:relative}
.tab .ms{font-size:26px}
.tab.on{color:var(--accent)}
.tab .bdg{position:absolute;top:-3px;left:52px;background:var(--red);color:#fff;font-size:11px;font-weight:700;min-width:18px;height:18px;border-radius:9px;display:flex;align-items:center;justify-content:center;padding:0 5px}

/* ---------- panneau (fiche) ---------- */
.backdrop{position:fixed;inset:0;background:var(--backdrop);z-index:40;opacity:0;transition:opacity .25s}
.backdrop.show{opacity:1}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:41;max-width:560px;margin:0 auto;background:var(--sheet);border-radius:14px 14px 0 0;
  max-height:94vh;overflow-y:auto;transform:translateY(100%);transition:transform .32s cubic-bezier(.2,.9,.25,1);padding:0 18px calc(22px + env(safe-area-inset-bottom));overscroll-behavior:contain}
.sheet.show{transform:none}
.grab{position:sticky;top:0;padding:8px 0 10px;display:flex;justify-content:center;background:var(--sheet);z-index:2}
.grab i{width:38px;height:5px;border-radius:3px;background:var(--text3)}
.hero{position:relative;height:200px;border-radius:16px;overflow:hidden;display:flex;align-items:center;justify-content:center;color:#fff}
.hero img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.hero .ph{font-size:64px}
.play{position:absolute;width:62px;height:62px;border-radius:31px;background:rgba(255,255,255,.3);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);display:flex;align-items:center;justify-content:center}
.play .ms{font-size:38px;color:#fff}
.meta{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:14px 0 8px;font-size:13.5px;color:var(--text2)}
.chip{display:inline-flex;align-items:center;gap:4px;font-size:13.5px;font-weight:700;border-radius:9px;padding:5px 9px;background:var(--accent-soft);color:var(--accent)}
.chip .ms{font-size:17px}
.sheet h3{font-size:24px;font-weight:800;letter-spacing:-.6px;line-height:1.18;margin-bottom:14px}
.verdict{background:var(--card2);border-radius:14px;padding:12px 14px;border-left:4px solid var(--orange);margin-bottom:14px}
.verdict small{font-size:11.5px;font-weight:800;letter-spacing:.6px;color:var(--orange);display:flex;align-items:center;gap:4px}
.verdict small .ms{font-size:15px}
.verdict p{font-size:18px;font-weight:700;margin-top:4px;letter-spacing:-.2px}
.resume{font-size:16px;color:var(--text2);line-height:1.45;margin-bottom:12px}
.keep{display:flex;gap:9px;background:var(--card2);border-radius:12px;padding:11px 12px;font-size:14.5px;margin-bottom:18px}
.keep .ms{color:var(--red);font-size:19px}
.prio{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:18px}
.prio>b{font-size:16px;white-space:nowrap}
.prio .seg{flex:0 1 250px}
.prio .seg button{padding:6px 6px;font-size:13px}
.three{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;margin-top:10px}
.small-danger{display:block;margin:18px auto 0;color:var(--red);font-size:14.5px}
.form label{display:block;font-size:13px;color:var(--text2);text-transform:uppercase;letter-spacing:.2px;margin:16px 4px 7px}
.form input,.form textarea,.form select{width:100%;background:var(--card2);border:0;border-radius:12px;padding:12px 14px;font-size:16px;outline:0;color:var(--text)}
.form textarea{min-height:90px;resize:vertical;line-height:1.4}
.swatches{display:flex;gap:10px;flex-wrap:wrap}
.sw{width:34px;height:34px;border-radius:17px;border:3px solid transparent;outline:2px solid transparent}
.sw.on{outline-color:var(--text);border-color:var(--sheet)}
.icons{display:grid;grid-template-columns:repeat(8,1fr);gap:6px;background:var(--card2);border-radius:12px;padding:10px}
.icons button{height:38px;border-radius:10px;display:flex;align-items:center;justify-content:center;color:var(--text2)}
.icons button.on{background:var(--accent);color:#fff}
.sheet-title{font-size:20px;font-weight:800;letter-spacing:-.4px;text-align:center;margin-bottom:6px}
.pick{--inset:58px}

/* ---------- divers ---------- */
.empty{text-align:center;color:var(--text2);padding:56px 24px;font-size:15.5px;line-height:1.45}
.empty .ms{font-size:48px;color:var(--text3);display:block;margin-bottom:10px}
.toast{pointer-events:none;position:fixed;left:50%;bottom:calc(96px + env(safe-area-inset-bottom));transform:translate(-50%,20px);opacity:0;z-index:60;
  background:rgba(40,40,42,.94);color:#fff;font-size:14.5px;font-weight:600;padding:10px 16px;border-radius:14px;transition:all .25s;max-width:88vw;text-align:center}
.toast.show{opacity:1;transform:translate(-50%,0)}
.ro{font-size:12.5px;color:var(--text2);text-align:center;margin:8px 0 0}
.handle{color:var(--text3);touch-action:none;padding:6px;cursor:grab}
.dragging{opacity:.9;box-shadow:0 10px 30px rgba(0,0,0,.2);z-index:5;background:var(--card)}
.num{width:20px;text-align:center;font-size:17px;font-weight:700;color:var(--text3);font-variant-numeric:tabular-nums}
.minus{width:24px;height:24px;border-radius:12px;background:var(--red);color:#fff;display:flex;align-items:center;justify-content:center;flex:none}
.minus .ms{font-size:18px}
.loading{padding:120px 0;text-align:center;color:var(--text2)}
</style>
</head>
<body>
<div id="app"><div class="loading">Chargement…</div></div>
<nav class="tabbar"><div class="in" id="tabs"></div></nav>
<div class="backdrop hidden" id="backdrop"></div>
<div class="sheet hidden" id="sheet"></div>
<div class="toast" id="toast"></div>

<script>
/* ======================================================================
   Mes vidéos — lit les données du reelbot et enregistre tes choix via le relais.
   ====================================================================== */
const API = "https://reelbot.zacharie-pires.workers.dev";
const REPO_RAW = "https://raw.githubusercontent.com/zachars-ctrl/reelbot/main/";
const tg = window.Telegram && window.Telegram.WebApp;
const canEdit = !!(tg && tg.initData);

const GRAD = {
  blue:["#2B8CFF","#0048C7"], orange:["#FFA53A","#FF5F2E"], green:["#34C759","#0E8F47"], pink:["#FF6B9A","#E0245E"],
  purple:["#B45CF0","#6A3FD1"], teal:["#35C8DA","#0A84A8"], yellow:["#FFCC00","#FF9500"], red:["#FF6A5F","#D70015"],
  indigo:["#6E72F6","#3B3FC4"], mint:["#2DD4BF","#0D8F84"], brown:["#C9956A","#8A5A33"], gray:["#A1A1AA","#5E5E63"],
};
const ICONS = ["smart_toy","settings_suggest","build","school","newspaper","work","payments","trending_up","skillet","restaurant",
  "local_cafe","fitness_center","directions_run","self_improvement","sentiment_very_satisfied","theater_comedy","flight",
  "travel_explore","home","chair","checkroom","brush","palette","photo_camera","movie","music_note","sports_esports",
  "psychology","favorite","pets","eco","science","code","smartphone","directions_car","shopping_bag","lightbulb","menu_book","public","folder"];
const PRIOS = [["", "—"], ["plus_tard", "Plus tard"], ["bientot", "Bientôt"], ["urgent", "Urgent"]];
const PRIO_RANK = { urgent: 3, bientot: 2, plus_tard: 1 };
const PRIO_LABEL = { urgent: "Urgent", bientot: "Bientôt", plus_tard: "Plus tard" };
const SRC_ICON = { Instagram: "photo_camera", TikTok: "music_note", YouTube: "smart_display", X: "tag", Facebook: "public", Web: "link" };

let D = { reels: [], categories: { categories: [], alias: {} }, categories_ia: [], perso: { items: {}, liste: [] } };
const S = { tab: "biblio", stack: [], seg: "tout", sort: "prio", q: "", editList: false, sheet: null };

/* ---------------- utilitaires ---------------- */
const $ = (s, r = document) => r.querySelector(s);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const slug = (s) => String(s || "").normalize("NFD").replace(/[̀-ͯ]/g, "").toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-|-$/g, "") || "autre";
const keyOf = (r) => r.id || r.lien;
const P = (r) => D.perso.items[keyOf(r)] || {};
const haptic = (t = "light") => { try { t === "sel" ? tg.HapticFeedback.selectionChanged() : tg.HapticFeedback.impactOccurred(t); } catch {} };
function toast(msg) { const t = $("#toast"); t.textContent = msg; t.classList.add("show"); clearTimeout(t._h); t._h = setTimeout(() => t.classList.remove("show"), 2200); }
function fmtDur(s) { if (!s) return ""; s = Math.round(s); const m = Math.floor(s / 60); return `${m}:${String(s % 60).padStart(2, "0")}`; }
function fmtMin(s) { if (!s) return ""; return s < 60 ? `${Math.round(s)} s` : `${Math.round(s / 60)} min`; }
function ago(d) {
  if (!d) return ""; const days = Math.round((new Date(new Date().toISOString().slice(0, 10)) - new Date(d)) / 864e5);
  if (days <= 0) return "aujourd'hui"; if (days === 1) return "hier"; if (days < 7) return `il y a ${days} j`;
  if (days < 30) return `il y a ${Math.round(days / 7)} sem.`; return new Date(d).toLocaleDateString("fr-FR", { day: "numeric", month: "short" });
}
const thumbUrl = (r) => !r.miniature ? "" : /^https?:/.test(r.miniature) ? r.miniature : REPO_RAW + r.miniature;

/* ---------------- catégories ---------------- */
function catsLive() {
  const map = {};
  for (const c of D.categories_ia || []) map[c.id] = { ...c };
  for (const c of D.categories.categories || []) map[c.id] = { ...(map[c.id] || {}), ...c };
  const alias = D.categories.alias || {};
  return Object.values(map).filter((c) => c.nom && !c.supprime && !alias[c.id] && c.id !== "autre");
}
function catOf(r) {
  if (r.categorie === "Échec") return "echec";
  let id = P(r).categorie || r.cat || slug(r.categorie);
  const alias = D.categories.alias || {}; let n = 0;
  while (alias[id] && n++ < 10) id = alias[id];
  return catInfo(id) ? id : "autre";
}
let _live = null;
function catInfo(id) {
  if (id === "autre") return { id: "autre", nom: "Autre", icone: "folder", couleur: "gray" };
  if (id === "echec") return { id: "echec", nom: "À revoir", icone: "error", couleur: "red" };
  return (_live || []).find((c) => c.id === id);
}
function counts() {
  const c = {};
  for (const r of visibleReels()) { const id = catOf(r); c[id] = (c[id] || 0) + 1; }
  return c;
}
const grad = (col) => { const g = GRAD[col] || GRAD.blue; return `linear-gradient(145deg,${g[0]},${g[1]})`; };
function visibleReels() { return D.reels.filter((r) => !P(r).supprime); }
function refreshCats() {
  _live = catsLive();
  const order = D.categories.ordre || [], cnt = counts();
  _live.sort((a, b) => {
    const ia = order.indexOf(a.id), ib = order.indexOf(b.id);
    if (ia !== -1 || ib !== -1) return (ia === -1 ? 1e9 : ia) - (ib === -1 ? 1e9 : ib);
    return (cnt[b.id] || 0) - (cnt[a.id] || 0);
  });
}
function ask(msg) {
  return new Promise((res) => {
    try { if (tg && tg.initData && tg.showConfirm) return tg.showConfirm(msg, (ok) => res(!!ok)); } catch {}
    res(window.confirm(msg));
  });
}

/* ---------------- données ---------------- */
async function load() {
  try {
    const r = await fetch(API + "/api/data", { cache: "no-store" });
    if (!r.ok) throw 0;
    D = await r.json();
  } catch {
    const get = (f, def) => fetch(REPO_RAW + f + "?t=" + Date.now()).then((r) => (r.ok ? r.json() : def)).catch(() => def);
    const [reels, categories, categories_ia, perso] = await Promise.all([
      get("reels.json", []), get("categories.json", { categories: [], alias: {} }), get("categories_ia.json", []), get("perso.json", { items: {}, liste: [] }),
    ]);
    D = { reels, categories, categories_ia, perso };
  }
  D.perso ||= { items: {}, liste: [] }; D.perso.items ||= {}; D.perso.liste ||= [];
  D.categories ||= { categories: [], alias: {} };
  refreshCats();
  render();
}

async function save(path, ops, apply) {
  if (!canEdit) { toast("Ouvre la page depuis Telegram pour modifier."); return false; }
  apply(); refreshCats(); render(); haptic();
  try {
    const r = await fetch(API + path, { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify({ initData: tg.initData, ops }) });
    const j = await r.json();
    if (!j.ok) throw new Error(j.error);
    if (j.perso) D.perso = j.perso;
    if (j.categories) D.categories = j.categories;
    refreshCats(); render();
    return true;
  } catch (e) { toast("Pas enregistré : " + (e.message || "réseau")); await load(); return false; }
}
function perso(ops) {
  return save("/api/perso", ops, () => {
    for (const op of ops) {
      const it = (D.perso.items[op.id] ||= {});
      if (op.op === "prio") op.value ? (it.prio = op.value) : delete it.prio;
      if (op.op === "vu") op.value ? (it.vu = new Date().toISOString().slice(0, 10)) : delete it.vu;
      if (op.op === "categorie") it.categorie = op.value;
      if (op.op === "liste_add" && !D.perso.liste.includes(op.id)) D.perso.liste.push(op.id);
      if (op.op === "liste_remove") D.perso.liste = D.perso.liste.filter((x) => x !== op.id);
      if (op.op === "liste_order") D.perso.liste = op.order;
      if (op.op === "supprimer") { it.supprime = true; D.perso.liste = D.perso.liste.filter((x) => x !== op.id); }
    }
  });
}
function catsSave(ops) {
  return save("/api/categories", ops, () => {
    const c = D.categories; c.categories ||= []; c.alias ||= {};
    for (const op of ops) {
      const i = c.categories.findIndex((x) => x.id === (op.cat ? op.cat.id : op.id));
      if (op.op === "save") i >= 0 ? (c.categories[i] = { ...c.categories[i], ...op.cat, supprime: false }) : c.categories.push(op.cat);
      if (op.op === "delete") i >= 0 ? (c.categories[i].supprime = true) : c.categories.push({ id: op.id, supprime: true });
      if (op.op === "merge") { c.alias[op.from] = op.to; const j = c.categories.findIndex((x) => x.id === op.from); j >= 0 ? (c.categories[j].supprime = true) : c.categories.push({ id: op.from, supprime: true }); }
      if (op.op === "order") c.ordre = op.order;
    }
  });
}

function rowHTML(r, opts = {}) {

const byKey = (k) => D.reels.find((r) => keyOf(r) === k);
function listeItems() { return D.perso.liste.map(byKey).filter((r) => r && !P(r).supprime); }
function sortItems(items, how) {
  const a = [...items];
  if (how === "recent") a.sort((x, y) => String(y.date).localeCompare(String(x.date)));
  else if (how === "note") a.sort((x, y) => (y.note || 0) - (x.note || 0));
  else a.sort((x, y) => (!!P(x).vu - !!P(y).vu) || ((PRIO_RANK[P(y).prio] || 0) - (PRIO_RANK[P(x).prio] || 0)) || ((y.note || 0) - (x.note || 0)) || String(y.date).localeCompare(String(x.date)));
  return a;
}

    <label>…va dans</label><select id="m-to">${opts}</select></div>
    <button class="btn" style="margin-top:20px" data-domerge>Fusionner</button>
    <p class="foot">Toutes ses vidéos passent dans la seconde.</p>`, (sh) => { const t = sh.querySelector("#m-to"); if (t.options.length > 1) t.selectedIndex = 1; });
}

/* ---------------- rendu + navigation ---------------- */
function current() { return S.stack.length ? S.stack[S.stack.length - 1] : S.tab; }
function render() {
  const cur = current(); let html;
  if (cur === "biblio") html = screenHome();
  else if (cur === "liste") html = screenListe();
  else if (cur === "recherche") html = screenSearch();
  else if (cur === "gerer") html = screenGerer();
  else if (cur.startsWith("cat:")) html = screenCat(cur.slice(4));
  $("#app").innerHTML = html;
  const nl = D.perso.liste.filter((k) => byKey(k)).length;
  $("#tabs").innerHTML = [["biblio", "video_library", "Bibliothèque"], ["liste", "bookmark", "Ma liste"], ["recherche", "search", "Recherche"]]
    .map(([t, ic, l]) => `<button class="tab ${S.tab === t ? "on" : ""}" data-tab="${t}"><span class="ms ${S.tab === t ? "f" : ""}">${ic}</span>${l}${t === "liste" && nl ? `<span class="bdg">${nl}</span>` : ""}</button>`).join("");
  const q = $("#q"); if (q) q.oninput = () => { S.q = q.value; $("#results").innerHTML = resultsHTML(S.q.trim().toLowerCase(), visibleReels().filter((r) => [r.titre, r.resume, r.a_retenir, r.verdict, r.categorie, r.source].join(" ").toLowerCase().includes(S.q.trim().toLowerCase()))); };
  const sel = $("[data-sort]"); if (sel) sel.onchange = () => { S.sort = sel.value; render(); };
  setupDrag("#liste", (order) => perso([{ op: "liste_order", order }]));
  setupDrag("#catlist", (order) => catsSave([{ op: "order", order }]));
  if (S.sheet && S.sheetKey && byKey(S.sheetKey) && $("#sheet .verdict, #sheet .prio, #sheet [data-watch]")) sheetVideo(S.sheetKey);
  syncBack();
}
function go(screen) { S.stack.push(screen); S.seg = "tout"; S.sort = "prio"; render(); window.scrollTo(0, 0); }
function back() { if (S.sheet) return closeSheet(); if (S.stack.length) { S.stack.pop(); render(); window.scrollTo(0, 0); } }
function syncBack() { if (!tg || !tg.BackButton) return; (S.sheet || S.stack.length) ? tg.BackButton.show() : tg.BackButton.hide(); }
function watch(k) { const r = byKey(k); if (!r) return; haptic(); try { tg ? tg.openLink(r.lien) : window.open(r.lien, "_blank"); } catch { window.open(r.lien, "_blank"); } }

/* ---------------- glisser pour réordonner ---------------- */
function setupDrag(sel, done) {
  const box = $(sel); if (!box) return;
  box.querySelectorAll("[data-handle]").forEach((h) => {
    h.onpointerdown = (e) => {
      e.preventDefault(); const row = h.closest("[data-key]"); const rows = [...box.querySelectorAll("[data-key]")];
      const startY = e.clientY, hgt = row.offsetHeight; let idx = rows.indexOf(row), target = idx;
      row.classList.add("dragging"); haptic("sel"); h.setPointerCapture(e.pointerId);
      h.onpointermove = (ev) => {
        const dy = ev.clientY - startY; row.style.transform = `translateY(${dy}px)`;
        target = Math.max(0, Math.min(rows.length - 1, idx + Math.round(dy / hgt)));
        rows.forEach((r, i) => { if (r === row) return; let s = 0; if (idx < target && i > idx && i <= target) s = -hgt; if (idx > target && i < idx && i >= target) s = hgt; r.style.transform = s ? `translateY(${s}px)` : ""; r.style.transition = "transform .15s"; });
      };
      h.onpointerup = () => {
        h.onpointermove = h.onpointerup = null; rows.forEach((r) => { r.style.transform = ""; r.style.transition = ""; }); row.classList.remove("dragging");
        if (target !== idx) { const keys = rows.map((r) => r.dataset.key); const [m] = keys.splice(idx, 1); keys.splice(target, 0, m); done(keys); }
      };
    };
  });
}

/* ---------------- clics ---------------- */
document.addEventListener("click", async (e) => {
  const t = e.target.closest("button, [data-open]"); if (!t) return;
  const d = t.dataset, k = S.sheetKey;
  if (d.tab) { S.tab = d.tab; S.stack = []; S.editList = false; render(); window.scrollTo(0, 0); if (d.tab === "recherche") setTimeout(() => $("#q") && $("#q").focus(), 50); haptic("sel"); return; }
  if (d.open) return sheetVideo(d.open);
  if (d.cat) return go("cat:" + d.cat);
  if (d.go) return go(d.go);
  if (d.back !== undefined) return back();
  if (d.seg) { S.seg = d.seg; haptic("sel"); return render(); }
  if (d.editlist !== undefined) { S.editList = !S.editList; return render(); }
  if (d.lremove) return perso([{ op: "liste_remove", id: d.lremove }]);
  if (d.watch !== undefined) return watch(k);
  if (d.prio !== undefined) return perso([{ op: "prio", id: k, value: d.prio }]);
  if (d.vu !== undefined) { const on = !P(byKey(k)).vu; const ops = [{ op: "vu", id: k, value: on }]; if (on && D.perso.liste.includes(k)) ops.push({ op: "liste_remove", id: k }); return perso(ops); }
  if (d.liste !== undefined) { const inL = D.perso.liste.includes(k); await perso([{ op: inL ? "liste_remove" : "liste_add", id: k }]); if (!inL) toast("Ajoutée à Ma liste"); return; }
  if (d.move !== undefined) return sheetMove(k);
  if (d.moveto) { const key = S.sheetKey; await perso([{ op: "categorie", id: key, value: d.moveto }]); toast("Déplacée dans « " + (catInfo(d.moveto) || {}).nom + " »"); return sheetVideo(key); }
  if (d.del !== undefined) { if (!(await ask("Supprimer cette vidéo de ta bibliothèque ?"))) return; closeSheet(); return perso([{ op: "supprimer", id: k }]); }
  if (d.editcat) return sheetCat(d.editcat);
  if (d.newcat !== undefined) return sheetCat(null);
  if (d.sw) { S.edit.couleur = d.sw; document.querySelectorAll("[data-sw]").forEach((b) => b.classList.toggle("on", b.dataset.sw === d.sw)); return haptic("sel"); }
  if (d.ic) { S.edit.icone = d.ic; document.querySelectorAll("[data-ic]").forEach((b) => b.classList.toggle("on", b.dataset.ic === d.ic)); return haptic("sel"); }
  if (d.savecat !== undefined) {
    const nom = $("#f-nom").value.trim(); if (!nom) return toast("Donne un nom à la catégorie.");
    let id = d.savecat;
    if (!id) { id = slug(nom); let n = 2; while (catInfo(id)) id = slug(nom) + "-" + n++; }
    closeSheet();
    return catsSave([{ op: "save", cat: { id, nom, icone: S.edit.icone, couleur: S.edit.couleur, description: $("#f-desc").value.trim() } }]);
  }
  if (d.delcat) { if (!(await ask("Supprimer cette catégorie ?"))) return; closeSheet(); S.stack = S.stack.filter((s) => s !== "cat:" + d.delcat); return catsSave([{ op: "delete", id: d.delcat }]); }
  if (d.merge !== undefined) return sheetMerge();
  if (d.domerge !== undefined) { const from = $("#m-from").value, to = $("#m-to").value; if (from === to) return toast("Choisis deux catégories différentes."); closeSheet(); return catsSave([{ op: "merge", from, to }]); }
  if (d.reclass !== undefined) {
    if (!canEdit) return toast("Ouvre la page depuis Telegram pour modifier.");
    if (!(await ask("Reclasser toutes les vidéos ? Tes déplacements manuels seront conservés."))) return;
    try { const r = await fetch(API + "/api/reclasser", { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify({ initData: tg.initData }) }); const j = await r.json(); if (!j.ok) throw new Error(j.error); toast("C'est parti : suis l'avancement dans Telegram."); }
    catch (err) { toast("Impossible : " + (err.message || "réseau")); }
  }
});
$("#backdrop").onclick = closeSheet;

/* glisser le panneau vers le bas pour le fermer */
(() => {
  const sh = $("#sheet"); let y0 = null, dy = 0;
  sh.addEventListener("touchstart", (e) => { if (sh.scrollTop <= 0) { y0 = e.touches[0].clientY; dy = 0; } }, { passive: true });
  sh.addEventListener("touchmove", (e) => { if (y0 === null) return; dy = e.touches[0].clientY - y0; if (dy > 0) { sh.style.transition = "none"; sh.style.transform = `translateY(${dy}px)`; } }, { passive: true });
  sh.addEventListener("touchend", () => { if (y0 === null) return; sh.style.transition = ""; sh.style.transform = ""; if (dy > 110) closeSheet(); y0 = null; });
})();

/* ---------------- thème + démarrage ---------------- */
function applyTheme() {
  const dark = tg && tg.colorScheme ? tg.colorScheme === "dark" : matchMedia("(prefers-color-scheme: dark)").matches;
  document.documentElement.dataset.theme = dark ? "dark" : "light";
  try { tg.setHeaderColor(dark ? "#000000" : "#F2F2F7"); tg.setBackgroundColor(dark ? "#000000" : "#F2F2F7"); tg.setBottomBarColor && tg.setBottomBarColor(dark ? "#161618" : "#F9F9FB"); } catch {}
}
applyTheme();
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", applyTheme);
if (tg) { tg.ready(); tg.expand(); tg.onEvent("themeChanged", applyTheme); tg.BackButton.onClick(back); tg.onEvent("activated", load); }
document.addEventListener("visibilitychange", () => { if (!document.hidden) load(); });
load();
</script>
</body>
