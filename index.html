<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mes réels</title>
<style>
  :root { --bg:#0f1115; --card:#1a1d24; --line:#2a2e38; --txt:#e9ebf0; --mute:#8b91a1; --acc:#5b9dff; --star:#ffc53d; }
  @media (prefers-color-scheme: light) {
    :root { --bg:#f4f5f8; --card:#fff; --line:#e1e4ea; --txt:#161a22; --mute:#6a7080; --acc:#2e6fe0; --star:#e5a400; }
  }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--txt); font:15px/1.4 system-ui,-apple-system,Segoe UI,Roboto,sans-serif; }
  header { position:sticky; top:0; background:var(--bg); padding:14px 16px 8px; z-index:2; border-bottom:1px solid var(--line); }
  h1 { font-size:20px; margin:0 0 10px; display:flex; justify-content:space-between; align-items:center; }
  h1 label { font-size:13px; font-weight:400; color:var(--mute); display:flex; gap:6px; align-items:center; }
  .tabs { display:flex; gap:8px; overflow-x:auto; padding-bottom:6px; scrollbar-width:none; }
  .tab { flex:none; border:1px solid var(--line); background:var(--card); color:var(--txt); border-radius:999px; padding:7px 12px; font-size:14px; }
  .tab.on { background:var(--acc); border-color:var(--acc); color:#fff; }
  .tab small { opacity:.7; margin-left:4px; }
  main { padding:12px 16px 40px; display:grid; gap:10px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:14px; padding:12px 14px; }
  .card.seen { opacity:.45; }
  .top { display:flex; justify-content:space-between; gap:10px; align-items:flex-start; }
  .t { font-weight:650; font-size:16px; }
  .stars { color:var(--star); white-space:nowrap; font-size:13px; }
  .meta { color:var(--mute); font-size:12px; margin:2px 0 6px; }
  .r { margin:0 0 6px; }
  .k { font-size:13px; margin:0 0 8px; }
  .row { display:flex; gap:8px; }
  .row a, .row button { flex:1; text-align:center; text-decoration:none; border-radius:10px; padding:9px; font-size:14px; border:1px solid var(--line); background:transparent; color:var(--txt); }
  .row a { background:var(--acc); color:#fff; border-color:var(--acc); }
  .empty { color:var(--mute); text-align:center; padding:40px 0; }
</style>
</head>
<body>
<header>
  <h1>📂 Mes réels <label><input type="checkbox" id="showSeen"> vus</label></h1>
  <div class="tabs" id="tabs"></div>
</header>
<main id="list"><p class="empty">Chargement…</p></main>
<script>
const ORDER = ["Tout","Tuto IA","Outil IA","Actu IA","Business","Marrant","Autre","Échec"];
const ICON = {"Tout":"⭐","Tuto IA":"🎓","Outil IA":"🛠️","Actu IA":"📰","Business":"💼","Marrant":"😂","Autre":"📦","Échec":"⚠️"};
let reels = [], cur = "Tout", seen = {};
try { seen = JSON.parse(localStorage.getItem("seen") || "{}"); } catch (e) {}
const saveSeen = () => { try { localStorage.setItem("seen", JSON.stringify(seen)); } catch (e) {} };
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const showSeen = document.getElementById("showSeen");
showSeen.onchange = render;

function render() {
  const visible = reels.filter(r => showSeen.checked || !seen[r.lien]);
  const count = c => visible.filter(r => c === "Tout" || r.categorie === c).length;
  document.getElementById("tabs").innerHTML = ORDER.filter(c => c === "Tout" || reels.some(r => r.categorie === c))
    .map(c => `<button class="tab ${c === cur ? "on" : ""}" data-c="${c}">${ICON[c]} ${c}<small>${count(c)}</small></button>`).join("");
  document.querySelectorAll(".tab").forEach(b => b.onclick = () => { cur = b.dataset.c; render(); });
  const items = visible.filter(r => cur === "Tout" || r.categorie === cur)
    .sort((a, b) => (b.note || 0) - (a.note || 0) || String(b.date).localeCompare(a.date));
  document.getElementById("list").innerHTML = items.length ? items.map(r => `
    <div class="card ${seen[r.lien] ? "seen" : ""}">
      <div class="top"><div class="t">${esc(r.titre)}</div><div class="stars">${"★".repeat(r.note || 0)}${"☆".repeat(5 - (r.note || 0))}</div></div>
      <div class="meta">${ICON[r.categorie] || ""} ${esc(r.categorie)} · ${esc(r.date)}</div>
      <p class="r">${esc(r.resume)}</p>
      ${r.a_retenir ? `<p class="k">📌 ${esc(r.a_retenir)}</p>` : ""}
      <div class="row"><a href="${esc(r.lien)}" target="_blank" rel="noopener">▶ Voir</a>
      <button data-l="${esc(r.lien)}">${seen[r.lien] ? "↺ Pas vu" : "✓ Vu"}</button></div>
    </div>`).join("") : `<p class="empty">Rien ici pour l'instant.</p>`;
  document.querySelectorAll("button[data-l]").forEach(b => b.onclick = () => {
    const l = b.dataset.l; seen[l] ? delete seen[l] : (seen[l] = 1); saveSeen(); render();
  });
}

// Lit reels.json directement dans le dépôt (toujours à jour, sans attendre GitHub Pages)
const user = location.hostname.split(".")[0], repo = location.pathname.split("/")[1];
const raw = location.hostname.endsWith("github.io")
  ? `https://raw.githubusercontent.com/${user}/${repo}/main/reels.json?t=${Date.now()}` : "reels.json";
fetch(raw).then(r => r.ok ? r.json() : []).catch(() => []).then(d => { reels = d; render(); });
</script>
</body>
</html>
