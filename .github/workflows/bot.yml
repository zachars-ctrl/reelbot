name: reelbot
on:
  schedule:
    - cron: "0 6,11,17 * * *"   # 3 fois/jour : ~8h, 13h, 19h (heure de Paris, UTC+2 en été)
  workflow_dispatch:       # bouton "Run workflow" pour lancer à la main
permissions:
  contents: write
concurrency: reelbot
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Des messages en attente ?
        id: check
        run: |
          n=$(curl -s "https://api.telegram.org/bot${{ secrets.TELEGRAM_TOKEN }}/getUpdates?timeout=0" | python3 -c "import sys,json;print(len(json.load(sys.stdin).get('result',[])))")
          echo "Messages : $n"
          echo "n=$n" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        if: steps.check.outputs.n != '0'
      - uses: actions/setup-python@v5
        if: steps.check.outputs.n != '0'
        with:
          python-version: "3.12"
      - name: Analyse
        if: steps.check.outputs.n != '0'
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          ALLOWED_CHAT_ID: ${{ secrets.ALLOWED_CHAT_ID }}
          COOKIES: ${{ secrets.INSTAGRAM_COOKIES }}
        run: |
          pip install -q -U yt-dlp google-genai requests
          if [ -n "$COOKIES" ]; then printf '%s\n' "$COOKIES" > cookies.txt; fi
          python bot.py
          rm -f cookies.txt
      - name: Sauvegarde du tableau
        if: steps.check.outputs.n != '0'
        run: |
          git config user.name reelbot
          git config user.email reelbot@users.noreply.github.com
          git add reels.csv 2>/dev/null || true
          git diff --cached --quiet || (git commit -m "nouveaux réels" && git push)
